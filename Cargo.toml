[package]
name = "ubuntu-admin-center"
version = "1.0.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14", "v4_12", "v4_10", "v4_8"] }
libadwaita = { version = "0.7", features = ["v1_5", "v1_4", "v1_3", "v1_2"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "ttf", "line_series"] }
plotters-backend = "0.3"
png = "0.17"
