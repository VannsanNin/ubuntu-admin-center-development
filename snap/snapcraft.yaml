name: angkor-ubuntu-admin
base: core24
version: "2.0.0"
title: Ubuntu Admin Center
summary: Ubuntu administration dashboard with live monitoring
description: |
  Native desktop administration dashboard for Ubuntu — system monitoring with
  live CPU/RAM/network/GPU graphs, package management, services, firewall,
  users, disks, backups, Docker containers, a command library, an AI
  assistant, and audit logging.

  Built with Tauri 2: React 19 frontend rendered in the system WebKit, with
  all privileged operations handled by a Rust backend through Tauri IPC.
  No web server, no database server — everything runs locally.
grade: stable
confinement: strict
license: MIT
contact: https://github.com/UbuntuAdminCenter/ubuntu-admin-center/issues
website: https://github.com/UbuntuAdminCenter/ubuntu-admin-center
source-code: https://github.com/UbuntuAdminCenter/ubuntu-admin-center
issues: https://github.com/UbuntuAdminCenter/ubuntu-admin-center/issues

apps:
  ubuntu-admin-center:
    command: bin/ubuntu-admin-center
    plugs:
      - browser-support
      - desktop
      - desktop-legacy
      - gsettings
      - hardware-observe
      - mount-observe
      - network
      - network-bind
      - opengl
      - process-control
      - system-observe
      - unity7
      - wayland
      - x11
      - firewall-control
      - ssh-keys
      - removable-media
      - udisks2
    environment:
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      TMPDIR: $XDG_RUNTIME_DIR

layout:
  /usr/share/icons:
    bind: $SNAP/usr/share/icons
  /usr/share/glib-2.0/schemas:
    bind: $SNAP/usr/share/glib-2.0/schemas

parts:
  app:
    plugin: nil
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - librsvg2-2
      - libxdo3
      - desktop-file-utils
      - fonts-noto
    build-packages:
      - libwebkit2gtk-4.1-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libglib2.0-dev
    override-build: |
      set -eux

      # --- Node from the build snap (falls back to system node) ----------
      NODE_BIN="$(find /snap/node/current -name node -type f 2>/dev/null | head -1 || true)"
      if [ -n "$NODE_BIN" ]; then
        export PATH="$(dirname "$NODE_BIN"):$PATH"
      elif ! command -v node >/dev/null 2>&1; then
        export NODE_DIR="$CRAFT_PART_BUILD/node"
        if [ ! -x "$NODE_DIR/bin/node" ]; then
          curl -fsSL https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz \
            | tar -xJC "$CRAFT_PART_BUILD"
          mv "$CRAFT_PART_BUILD/node-v24.20.0-linux-x64" "$NODE_DIR"
        fi
        export PATH="$NODE_DIR/bin:$PATH"
      fi
      node --version

      # --- Rust toolchain --------------------------------------------------
      # Always use rustup to get a cargo that supports lockfile v4+.
      export RUSTUP_HOME="$CRAFT_PART_BUILD/rustup"
      export CARGO_HOME="$CRAFT_PART_BUILD/cargo"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain stable
      export PATH="$CARGO_HOME/bin:$PATH"
      cargo --version

      # Build from the project tree itself ($CRAFT_PART_SRC excludes
      # gitignored subdirs like src-tauri/icons, so use the real root).
      cd "$CRAFT_PROJECT_DIR"

      # --- Frontend ---------------------------------------------------------
      npm ci
      npm run build

      # --- Tauri backend ------------------------------------------------------
      cd src-tauri
      cargo build --release --features tauri/custom-protocol
      install -Dm755 target/release/ubuntu-admin-center \
        "$CRAFT_PART_INSTALL/bin/ubuntu-admin-center"

      # --- Desktop integration -----------------------------------------------
      install -Dm644 icons/128x128.png "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      install -Dm644 ../snap/gui/ubuntu-admin-center.desktop \
        "$CRAFT_PART_INSTALL/meta/gui/ubuntu-admin-center.desktop"

  local-files:
    plugin: dump
    source: snap/local
    organize:
      bin/snap-admin-wrapper: bin/snap-admin-wrapper
      com.ubuntuadmincenter.policy: usr/share/polkit-1/actions/com.ubuntuadmincenter.policy
