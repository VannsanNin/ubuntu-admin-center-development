[package]
name = "ubuntu-admin-center"
version = "2.0.0"
description = "Ubuntu Admin Center - native desktop administration dashboard"
authors = ["you"]
edition = "2021"

[lib]
name = "ubuntu_admin_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
bcrypt = "0.15"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
